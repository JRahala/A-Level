<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <title> {{title}} </title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js" integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA==" crossorigin="anonymous"></script>
    <script type="text/javascript" charset="utf-8">
        var socket = io();
        socket.on('connect', function() {
          // socket is connected to the server
        });
        
        // placement element template
        let placementTemplate = `

        <div class="card-header">
            <div class="row">
                <div class="col-8">
                    <h5><span class="placement-title"></span></h5>
                </div>
                <div class="col-4 text-end">
                    <span class="start-date"> </span> - <span class="end-date"></span>
                </div>
            </div>
        </div>

        <div class="card-body">
            <h5 class="card-title"><button type="button" class="btn btn-light" onclick=""><span class="company-name"></span></button></h5>
            <p class="card-text">
                <span class="placement-description">
            </p>

            <a href="#" class="btn btn-primary me-2 edit-button" onclick="loadPlacementToForm(this)">Edit <i class="bi bi-pencil-square"></i></a>
            <a href="#" class="btn btn-danger me-2 delete-button" onclick="deletePlacementForm(this)">Delete <i class="bi bi-trash-fill"></i></a>
            <a href="#" class="btn btn-success me-2 save-button"" onclick="savePlacement(this)">Save <i class="bi bi-bookmark-plus-fill"></i></a>

            <a href="#" class="btn btn-primary me-2 apply-button" style="display:none" onclick="applyPlacement(this)">Apply <i class="bi bi-briefcase-fill"></i></a>
            <a href="#" class="btn btn-dark me-2 msg-button" style="display:none" onclick="messagePlacement(this)">Message <i class="bi bi-chat-dots-fill"></i></a>
        </div>

        <div class="card-footer">
            <span class="badge rounded-pill bg-dark me-1"><span class="placement-location"></span></span>
            <span class="subject-tags"></span>
        </div>

        `
        
      // return placement data from placement element in JSON format
      function placementElementToJSON(placementElement){
          let placementTitle = placementElement.getElementsByClassName("placement-title")[0].innerText;
          let placementDescription = placementElement.getElementsByClassName("placement-description")[0].innerText;
          let placementStartDate = placementElement.getElementsByClassName("start-date")[0].innerText;
          let placementEndDate = placementElement.getElementsByClassName("end-date")[0].innerText;
          let placementSubjectTagElements = placementElement.getElementsByClassName("subject-tag"); 
          let placementLocationTag = placementElement.getElementsByClassName("placement-location")[0].innerText;
          let placementCompanyName = placementElement.getElementsByClassName("company-name")[0].innerText;

          // retrieve the strings from subject tags
          let placementSubjectTags = [];
          for (let i=0; i<placementSubjectTagElements.length; i++){
              let placementSubjectTag = placementSubjectTagElements[i].innerText;
              placementSubjectTags.push(placementSubjectTag)
          }

          // return JSON element
          return {
              placementTitle: placementTitle,
              placementDescription: placementDescription,
              placementStartDate: placementStartDate,
              placementEndDate: placementEndDate,
              placementSubjectTags: placementSubjectTags,
              placementLocationTag: placementLocationTag,
              placementCompanyName: placementCompanyName
          }
      }


        // render json summary into placement element
        function placementElement(placementData){

          // create element
          let newPlacementElement = document.createElement("div");
          newPlacementElement.classList = "card mb-3";
          newPlacementElement.innerHTML = placementTemplate;

          // fill information
          newPlacementElement.getElementsByClassName("start-date")[0].innerText = placementData.date_range_tag.start_date;
          newPlacementElement.getElementsByClassName("end-date")[0].innerText = placementData.date_range_tag.end_date;
          newPlacementElement.getElementsByClassName("company-name")[0].innerText = placementData.company;

          newPlacementElement.getElementsByClassName("placement-location")[0].innerText = placementData.location_tag;
          newPlacementElement.getElementsByClassName("placement-title")[0].innerText = placementData.title;
          newPlacementElement.getElementsByClassName("placement-description")[0].innerText = placementData.description;

                  
          newPlacementElement.getElementsByClassName("card-title")[0].getElementsByTagName("button")[0].onclick = function(){
            window.location = "/company/" + placementData.company;
          }

          // loop for each subject tag in placement
          for (let i=0; i < placementData.subject_tags.length; i++){
              let subjectTagElement = document.createElement("span");
              subjectTagElement.classList = "badge rounded-pill bg-secondary me-1 subject-tag";
              subjectTagElement.innerText = placementData.subject_tags[i];
              newPlacementElement.getElementsByClassName("subject-tags")[0].appendChild(subjectTagElement);
          }

          // if isStudent, show the apply button, hide edit button, hide delete button
          if (isStudent == true){
            newPlacementElement.getElementsByClassName("apply-button")[0].style.display = "";
            newPlacementElement.getElementsByClassName("edit-button")[0].style.display = "none";
            newPlacementElement.getElementsByClassName("delete-button")[0].style.display = "none";
          }

          return newPlacementElement;

        }

        // check if current user is student or not 
        socket.emit("isStudent")
        var isStudent = true;

        function changeStudent(response){
          isStudent = response;
        }

        socket.on("recieveStudent", function(response){
          // update if user is student
          changeStudent(response);
        })

        // apply to placement
        function applyPlacement(element){
          // retrieve data from clicked element
          let placementElement = element.parentNode.parentNode;
          let placementJSON = placementElementToJSON(placementElement);

          // send placement title to server for deletion
          socket.emit("applyPlacement", placementJSON);
        }

        // send request to save placement element to the server
        function savePlacement(element){
            // retrieve data from clicked element
            let placementElement = element.parentNode.parentNode;
            let placementJSON = placementElementToJSON(placementElement);

            // send placement title and company name to the server
            socket.emit("savePlacement", placementJSON);
        }



    </script>

  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Work Experience</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav">
            <li class="nav-item ms-2">
            <a class="nav-link active" aria-current="page" href="/homepage">Home feed</a>
            </li>
            <li class="nav-item ms-2">
            <a class="nav-link" href="/saved_placements">Saved placements</a>
            </li>
            <li class="nav-item ms-2">
                <a class="nav-link" href="/messages">Messages <span id="message-count"></span></a>
            </li>
            <li class="nav-item ms-2">
            <a class="nav-link" href="/notifications">Notifications <span id="notification-count"></span></a>
            </li>
            <li class="nav-item ms-5">
            <a class="nav-link" href="/search">Work experience search engine</a>
            </li>            
        </ul>
        </div>
    </div>
    </nav>

    
    <div class = 'container'>
      {% block content %}
      {% endblock %}
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
  </body>
</html>
